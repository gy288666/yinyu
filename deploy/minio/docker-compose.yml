# 音域（YinYu）音乐平台 - MinIO 对象存储部署
# 用法: docker compose up -d
# API:     http://localhost:9000
# 控制台:  http://localhost:9001  (密码经环境变量 MINIO_ROOT_PASSWORD 提供)

services:
  minio:
    image: minio/minio:latest
    container_name: yinyu-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API 端口（Spring Boot 对接用这个）
      - "9001:9001"   # Web 控制台端口
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请先设置 MINIO_ROOT_PASSWORD 环境变量（或在本目录创建 .env）}
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # init 容器：启动后自动创建桶并设置匿名只读策略，执行完即退出
  minio-init:
    image: minio/mc:latest
    container_name: yinyu-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请先设置 MINIO_ROOT_PASSWORD 环境变量（或在本目录创建 .env）}
    entrypoint: >
      /bin/sh -c "
      mc alias set yinyu http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
      mc mb --ignore-existing yinyu/music;
      mc mb --ignore-existing yinyu/cover;
      mc mb --ignore-existing yinyu/avatar;
      mc mb --ignore-existing yinyu/banner;
      mc anonymous set download yinyu/cover;
      mc anonymous set download yinyu/avatar;
      mc anonymous set download yinyu/banner;
      echo 'MinIO buckets initialized: music, cover, avatar, banner (cover/avatar/banner anonymous read-only)';
      exit 0;
      "

volumes:
  minio-data:
    name: yinyu-minio-data
